services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api1
    expose:
      - "3000"

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api2
    expose:
      - "3000"

  api3:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api3
    expose:
      - "3000"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
