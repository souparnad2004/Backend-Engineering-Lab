services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    expose:
      - "3000"

    restart: unless-stopped

    networks:
      - backend

  nginx:
    image: nginx:stable-alpine

    ports:
      - "8080:80"

    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

    restart: unless-stopped

    networks:
      - backend

networks:
  backend:
    driver: bridge